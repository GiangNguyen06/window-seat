[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "window-seat"
version = "0.1.0"
description = "Compute what you can see from an airplane window, from Flightradar24 / OpenSky flight data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "pillow>=10"]

[project.optional-dependencies]
terrain = ["pillow>=10"]
dev = ["pytest>=8", "pillow>=10", "ruff>=0.5"]

[project.scripts]
windowseat = "windowseat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windowseat = ["data/*.csv", "viewer/*", "viewer/assets/*"]

[tool.ruff]
line-length = 120
